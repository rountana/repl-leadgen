openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: HVCG Lead Magnet Builder API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: lead-magnets
    description: Lead magnet operations
  - name: templates
    description: Design template operations
  - name: examples
    description: Example gallery operations
  - name: industries
    description: Industry list operations
  - name: ai
    description: AI helper operations
paths:
  /profile:
    get:
      operationId: getProfile
      tags: [profile]
      summary: Get or auto-create the current user's business profile
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
    put:
      operationId: updateProfile
      tags: [profile]
      summary: Upsert the current user's business profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileBody"
      responses:
        "200":
          description: Updated user profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"

  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /lead-magnets:
    get:
      operationId: listLeadMagnets
      tags: [lead-magnets]
      summary: List all lead magnets for the current user
      responses:
        "200":
          description: List of lead magnets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LeadMagnet"
    post:
      operationId: createLeadMagnet
      tags: [lead-magnets]
      summary: Create a new lead magnet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeadMagnetInput"
      responses:
        "201":
          description: Created lead magnet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeadMagnet"

  /lead-magnets/summary:
    get:
      operationId: getLeadMagnetsSummary
      tags: [lead-magnets]
      summary: Get dashboard summary counts by status
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeadMagnetsSummary"

  /lead-magnets/{id}:
    get:
      operationId: getLeadMagnet
      tags: [lead-magnets]
      summary: Get a single lead magnet
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Lead magnet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeadMagnet"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: updateLeadMagnet
      tags: [lead-magnets]
      summary: Update a lead magnet
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeadMagnetUpdate"
      responses:
        "200":
          description: Updated lead magnet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeadMagnet"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteLeadMagnet
      tags: [lead-magnets]
      summary: Delete a lead magnet
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Deleted

  /lead-magnets/{id}/approve:
    post:
      operationId: approveLeadMagnet
      tags: [lead-magnets]
      summary: Approve a lead magnet to go live
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Approved lead magnet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeadMagnet"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /lead-magnets/{id}/file:
    post:
      operationId: uploadLeadMagnetFile
      tags: [lead-magnets]
      summary: Upload or set the give-away file for a lead magnet
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FileUploadInput"
      responses:
        "200":
          description: File uploaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileUploadResult"

  /templates:
    get:
      operationId: listTemplates
      tags: [templates]
      summary: List all design templates
      responses:
        "200":
          description: List of templates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Template"

  /templates/{id}:
    get:
      operationId: getTemplate
      tags: [templates]
      summary: Get a single template
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Template"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /examples:
    get:
      operationId: listExamples
      tags: [examples]
      summary: List gallery examples, optionally filtered by industry
      parameters:
        - name: industry
          in: query
          required: false
          schema:
            type: ["string", "null"]
      responses:
        "200":
          description: List of examples
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Example"

  /industries:
    get:
      operationId: listIndustries
      tags: [industries]
      summary: List all industries for gallery filtering
      responses:
        "200":
          description: List of industries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Industry"

  /ai/prefill:
    post:
      operationId: aiPrefill
      tags: [ai]
      summary: AI pre-fill form fields from a URL or uploaded document
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiPrefillInput"
      responses:
        "200":
          description: Pre-filled fields
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiPrefillResult"

  /fb/connection:
    get:
      operationId: getFbConnection
      tags: [fb]
      summary: Get the current user's Facebook connection
      responses:
        "200":
          description: FB connection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FbConnection"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createFbConnection
      tags: [fb]
      summary: Create or replace the current user's Facebook connection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FbConnectionInput"
      responses:
        "200":
          description: Created FB connection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FbConnection"
    delete:
      operationId: deleteFbConnection
      tags: [fb]
      summary: Disconnect the current user's Facebook connection
      responses:
        "204":
          description: Deleted

  /fb/campaigns/generate-ad:
    post:
      operationId: generateFbAd
      tags: [fb]
      summary: Generate FB ad copy and image from business info
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FbAdGenerationInput"
      responses:
        "200":
          description: Generated ad draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FbAdDraft"

  /fb/campaigns:
    get:
      operationId: listFbCampaigns
      tags: [fb]
      summary: List all Facebook campaigns for the current user
      responses:
        "200":
          description: List of FB campaigns
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FbCampaign"
    post:
      operationId: createFbCampaign
      tags: [fb]
      summary: Create a new Facebook campaign
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FbCampaignInput"
      responses:
        "201":
          description: Created FB campaign
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FbCampaign"

  /fb/campaigns/sync:
    post:
      operationId: syncFbCampaigns
      tags: [fb]
      summary: Re-check Meta status for all live/launching/paused campaigns
      responses:
        "200":
          description: Sync result
          content:
            application/json:
              schema:
                type: object
                properties:
                  synced:
                    type: number
                  updated:
                    type: number
                required:
                  - synced
                  - updated

  /fb/campaigns/{id}:
    get:
      operationId: getFbCampaign
      tags: [fb]
      summary: Get a single Facebook campaign
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: FB campaign
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FbCampaign"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateFbCampaign
      tags: [fb]
      summary: Update fields on a draft or failed campaign
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateFbCampaignBody"
      responses:
        "200":
          description: Updated FB campaign
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FbCampaign"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Cannot edit a live campaign
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteFbCampaign
      tags: [fb]
      summary: Delete a draft or failed Facebook campaign
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Cannot delete a live campaign
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /fb/campaigns/{id}/launch:
    post:
      operationId: launchFbCampaign
      tags: [fb]
      summary: Launch a Facebook campaign via the partner adapter
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Launched FB campaign
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FbCampaign"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /fb/campaigns/{id}/lead-status:
    get:
      operationId: getFbCampaignLeadStatus
      tags: [fb]
      summary: Check the lead delivery status for a campaign
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Lead delivery status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FbLeadStatus"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /fb/webhooks/leads:
    post:
      operationId: receiveFbLead
      tags: [fb]
      summary: Receive an inbound lead from the partner (public, no auth)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FbLeadWebhookPayload"
      responses:
        "200":
          description: Lead received
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /ai/extract-branding:
    post:
      operationId: aiExtractBranding
      tags: [ai]
      summary: Extract logo and tagline from a source URL or document
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiBrandingInput"
      responses:
        "200":
          description: Extracted branding
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiBrandingResult"

components:
  schemas:
    UserProfile:
      type: object
      required:
        - id
        - userId
        - createdAt
        - updatedAt
      properties:
        id:
          type: number
        userId:
          type: string
        businessName:
          type: string
          nullable: true
        businessLocation:
          type: string
          nullable: true
        industry:
          type: string
          nullable: true
        logoUrl:
          type: string
          nullable: true
        createdAt:
          type: string
        updatedAt:
          type: string

    UpdateProfileBody:
      type: object
      properties:
        businessName:
          type: string
          nullable: true
        businessLocation:
          type: string
          nullable: true
        industry:
          type: string
          nullable: true
        logoUrl:
          type: string
          nullable: true

    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    LeadMagnet:
      type: object
      properties:
        id:
          type: number
        userId:
          type: string
        type:
          type: string
          enum: [existing_url, give_away]
        status:
          type: string
          enum: [draft, review, live]
        title:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
        existingUrl:
          type: ["string", "null"]
        businessName:
          type: ["string", "null"]
        businessLocation:
          type: ["string", "null"]
        giveawayFileName:
          type: ["string", "null"]
        giveawayFileUrl:
          type: ["string", "null"]
        templateId:
          type: ["number", "null"]
        customFontColor:
          type: ["string", "null"]
        customBgColor:
          type: ["string", "null"]
        customTextColor:
          type: ["string", "null"]
        logoUrl:
          type: ["string", "null"]
        tagline:
          type: ["string", "null"]
        ctaText:
          type: ["string", "null"]
        shareUrl:
          type: ["string", "null"]
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - userId
        - type
        - status
        - createdAt
        - updatedAt

    LeadMagnetInput:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum: [existing_url, give_away]
        title:
          type: string
        description:
          type: string
        existingUrl:
          type: string
        businessName:
          type: string
        businessLocation:
          type: string
        templateId:
          type: number
        customFontColor:
          type: string
        customBgColor:
          type: string
        customTextColor:
          type: string

    LeadMagnetUpdate:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        existingUrl:
          type: string
        businessName:
          type: string
        businessLocation:
          type: string
        templateId:
          type: number
        customFontColor:
          type: string
        customBgColor:
          type: string
        customTextColor:
          type: string
        logoUrl:
          type: string
        tagline:
          type: string
        ctaText:
          type: string

    LeadMagnetsSummary:
      type: object
      properties:
        total:
          type: number
        live:
          type: number
        review:
          type: number
        draft:
          type: number
      required:
        - total
        - live
        - review
        - draft

    Template:
      type: object
      properties:
        id:
          type: number
        name:
          type: string
        layout:
          type: string
          enum: [split, banner, overlay, stacked, minimal]
        description:
          type: string
        previewColor:
          type: string
        accentColor:
          type: string
        fontFamily:
          type: string
        sampleImageUrl:
          type: ["string", "null"]
      required:
        - id
        - name
        - layout
        - description
        - previewColor
        - accentColor
        - fontFamily

    Example:
      type: object
      properties:
        id:
          type: number
        industry:
          type: string
        title:
          type: string
        description:
          type: string
        giveawayType:
          type: string
        imageUrl:
          type: ["string", "null"]
      required:
        - id
        - industry
        - title
        - description
        - giveawayType

    Industry:
      type: object
      properties:
        id:
          type: number
        name:
          type: string
        slug:
          type: string
      required:
        - id
        - name
        - slug

    FileUploadInput:
      type: object
      required:
        - fileName
        - fileDataUrl
      properties:
        fileName:
          type: string
        fileDataUrl:
          type: string
          description: Base64-encoded data URL of the file

    FileUploadResult:
      type: object
      properties:
        fileUrl:
          type: string
        fileName:
          type: string
      required:
        - fileUrl
        - fileName

    AiPrefillInput:
      type: object
      properties:
        sourceUrl:
          type: ["string", "null"]
        documentDataUrl:
          type: ["string", "null"]
          description: Base64-encoded document content
      required: []

    AiPrefillResult:
      type: object
      properties:
        title:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
        businessName:
          type: ["string", "null"]
        businessLocation:
          type: ["string", "null"]

    AiBrandingInput:
      type: object
      properties:
        sourceUrl:
          type: ["string", "null"]
        documentDataUrl:
          type: ["string", "null"]
      required: []

    AiBrandingResult:
      type: object
      properties:
        logoUrl:
          type: ["string", "null"]
        tagline:
          type: ["string", "null"]
        primaryColor:
          type: ["string", "null"]

    FbConnection:
      type: object
      description: Facebook connection record — partner credentials are never returned.
      properties:
        id:
          type: number
        userId:
          type: string
        fbPageId:
          type: ["string", "null"]
        fbPageName:
          type: ["string", "null"]
        adAccountId:
          type: ["string", "null"]
        adAccountName:
          type: ["string", "null"]
        partnerCampaignId:
          type: ["string", "null"]
          description: Shared Meta campaign ID — created once, reused for all ads.
        status:
          type: string
          enum: [connected, disconnected]
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - userId
        - status
        - createdAt
        - updatedAt

    FbConnectionInput:
      type: object
      required:
        - fbPageId
        - adAccountId
      properties:
        fbPageId:
          type: string
        fbPageName:
          type: string
        adAccountId:
          type: string
        adAccountName:
          type: string

    FbAdGenerationInput:
      type: object
      required:
        - businessName
        - industry
        - location
        - offer
      properties:
        businessName:
          type: string
        industry:
          type: string
        location:
          type: string
        offer:
          type: string

    FbAdDraft:
      type: object
      properties:
        headline:
          type: string
        bodyText:
          type: string
        imageUrl:
          type: string
      required:
        - headline
        - bodyText
        - imageUrl

    FbCampaign:
      type: object
      properties:
        id:
          type: number
        userId:
          type: string
        connectionId:
          type: ["number", "null"]
        headline:
          type: ["string", "null"]
        bodyText:
          type: ["string", "null"]
        imageUrl:
          type: ["string", "null"]
        dailyBudgetCents:
          type: ["number", "null"]
        targetingRadiusMiles:
          type: ["number", "null"]
        targetingLatitude:
          type: ["string", "null"]
        targetingLongitude:
          type: ["string", "null"]
        partnerCampaignId:
          type: ["string", "null"]
        partnerAdSetId:
          type: ["string", "null"]
        partnerAdId:
          type: ["string", "null"]
        status:
          type: string
          enum: [draft, launching, live, paused, error]
        leadDeliveryStatus:
          type: string
          enum: [unverified, active, failed]
        errorMessage:
          type: ["string", "null"]
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - userId
        - status
        - leadDeliveryStatus
        - createdAt
        - updatedAt

    FbCampaignInput:
      type: object
      required:
        - headline
        - bodyText
        - imageUrl
        - dailyBudgetCents
        - targetingRadiusMiles
        - targetingLatitude
        - targetingLongitude
      properties:
        headline:
          type: string
        bodyText:
          type: string
        imageUrl:
          type: string
        dailyBudgetCents:
          type: number
        targetingRadiusMiles:
          type: number
        targetingLatitude:
          type: number
        targetingLongitude:
          type: number

    UpdateFbCampaignBody:
      type: object
      properties:
        headline:
          type: string
        bodyText:
          type: string
        imageUrl:
          type: string
        dailyBudgetCents:
          type: number
        targetingRadiusMiles:
          type: number
        targetingLatitude:
          type: number
        targetingLongitude:
          type: number
        destinationUrl:
          type: string

    FbLeadStatus:
      type: object
      properties:
        status:
          type: string
          enum: [active, failed, unverified]
        checkedAt:
          type: string
      required:
        - status
        - checkedAt

    FbLeadWebhookPayload:
      type: object
      required:
        - campaignId
        - firstName
        - lastName
        - email
      properties:
        campaignId:
          type: number
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        phone:
          type: string
