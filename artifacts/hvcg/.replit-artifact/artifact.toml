kind = "web"
previewPath = "/"
title = "HVCG — Lead Magnet Builder"
description = "A web app for business owners to create lead magnet pages — either linking an existing webpage or building a Give-Away page (teaser copy + downloadable file behind a capture form). Includes AI pre-fill, template selection, gallery of examples, and a review/approval flow before anything goes live."
version = "1.0.0"
id = "artifacts/hvcg"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20760

[services.development]
run = "pnpm --filter @workspace/hvcg run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/hvcg", "run", "build" ]
serve = "static"
publicDir = "artifacts/hvcg/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20760"
BASE_PATH = "/"
