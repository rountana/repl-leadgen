kind = "web"
previewPath = "/apps/fb/"
title = "Facebook Ads — Integration Wizard"
description = "A four-step wizard that guides business owners through connecting their Facebook account, reviewing AI-generated ad creative, setting budget and targeting, and launching a live Facebook ad campaign. Shows campaign status, lead-delivery verification, and a campaign list screen. Standalone from the HVCG lead-magnet builder."
version = "1.0.0"
id = "artifacts/fb-integration"
router = "path"

[[services]]
name = "web"
paths = [ "/apps/fb/", "/fb/" ]
localPort = 18401

[services.development]
run = "pnpm --filter @workspace/fb-integration run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/fb-integration", "run", "build" ]
serve = "static"
publicDir = "artifacts/fb-integration/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18401"
BASE_PATH = "/apps/fb/"
